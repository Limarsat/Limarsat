<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirect</title>
    <script>
        var path = window.location.pathname;
        if (path.endsWith('.html')) {
            // الملف موجود، اتركه يحمّل بشكل طبيعي
        } else {
            // إذا لم يكن هناك ملف، أعد توجيه إلى الرئيسية
            window.location.href = '/';
        }
    </script>
</head>
<body>
</body>
</html>
